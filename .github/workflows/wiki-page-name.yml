# What the page_name of a wiki page made on the web interface can be:
# whether it can begin with -, and whether the runner reads it as a
# workflow command. Step a prints the payload between ::stop-commands::
# and its token, then prints each page_name as a line of its own.
name: wiki-page-name
on: gollum
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: a
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
        run: |
          T="wsstop$GITHUB_RUN_ID$RANDOM"
          echo "::stop-commands::$T"
          jq -c '[.pages[] | {action, page_name, title, summary, sha, html_url}]' "$GITHUB_EVENT_PATH"
          jq -j '.pages[] | .page_name, "\n"' "$GITHUB_EVENT_PATH" | od -c
          jq -j '.pages[] | .title, "\n"' "$GITHUB_EVENT_PATH" | od -c
          echo "::$T::"
          echo "probe: raw page_name lines follow"
          jq -r '.pages[].page_name' "$GITHUB_EVENT_PATH"
          echo "probe: raw page_name lines end"
      - env:
          O: ${{ toJSON(steps.a.outputs) }}
        run: |
          echo "probe: outputs=$O"
          echo "probe: PATH=$PATH"
          echo "probe: mask ws4mask"
